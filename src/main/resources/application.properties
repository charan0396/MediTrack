spring.application.name=MediTrack

# Render server port
server.port=${PORT:8080}

# Neon PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/mobileapp
spring.datasource.username=postgres
spring.datasource.password=welcome
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# Too many wrong passwords (or reset codes) lock the login for a while
app.login.max-attempts=5
app.login.lock-minutes=15

