# Neon PostgreSQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ---- File uploads (prescription, bill, scan documents, others) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
# NOTE (MySQL): if saving large files fails, raise max_allowed_packet on the DB server, e.g. 64M

# ---- MediTrack settings (NEW) ----
# Super user: created automatically at startup if missing. Can view ALL records and insert records.
app.super-user.name=Thota
app.super-user.password=family
# Forgot-password popup needs this code. Share it only with people who may reset passwords. CHANGE IT.
app.password-reset-code=MEDITRACK-RESET

