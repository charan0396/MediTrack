<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack - Record</title>
    <link rel="stylesheet" href="css/records.css">
</head>
<body>
<main class="wrap wide">

    <header class="topbar">
        <span class="brand">MediTrack</span>
        <div class="line"></div>
        <span class="user" id="userName" title="Logged in user"></span>
        <button type="button" id="homeBtn" class="nav-btn">home</button>
        <button type="button" id="viewBtn" class="nav-btn">view</button>
        <button type="button" id="billBtn" class="nav-btn">bill</button>
        <button type="button" id="recordBtn" class="nav-btn active" aria-current="page">record</button>
        <button type="button" id="logoutBtn" class="nav-btn">logout</button>
    </header>

    <div class="form-wrap">
    <form id="recordForm" autocomplete="off" novalidate>

        <div class="grid">
            <div class="f">
                <label for="recName">Name <span class="req" title="Required">*</span></label>
                <input type="text" id="recName" name="name" class="input" maxlength="100" data-case="title">
            </div>
            <div class="f">
                <label for="recDate">Date <span class="req" title="Required">*</span></label>
                <input type="date" id="recDate" name="date" class="input">
            </div>
            <div class="f">
                <label for="recType">Medical Type <span class="req" title="Required">*</span></label>
                <select id="recType" name="medicalType" class="input">
                    <option value="">Select medical type</option>
                    <option value="Pediatrician">Pediatrician</option>
                    <option value="Neurologist">Neurologist</option>
                    <option value="Dermatologist">Dermatologist</option>
                    <option value="Anesthesiologist">Anesthesiologist</option>
                    <option value="Psychiatrist">Psychiatrist</option>
                    <option value="Gynecologist">Gynecologist</option>
                    <option value="General Practitioner">General Practitioner</option>
                    <option value="Dentist">Dentist</option>
                    <option value="Family Doctor">Family Doctor</option>
                    <option value="Surgeon">Surgeon</option>
                    <option value="Pulmonologist">Pulmonologist</option>
                    <option value="Veterinarian">Veterinarian</option>
                    <option value="Cardiologist">Cardiologist</option>
                    <option value="Epidemiologist">Epidemiologist</option>
                    <option value="Rheumatologist">Rheumatologist</option>
                    <option value="Urologist">Urologist</option>
                    <option value="Optometrist">Optometrist</option>
                    <option value="Radiologist">Radiologist</option>
                    <option value="ENT Specialist">ENT Specialist</option>
                    <option value="Plastic Surgeon">Plastic Surgeon</option>
                </select>
            </div>

            <div class="f">
                <label for="hospitalName">Hospital Name</label>
                <input type="text" id="hospitalName" name="hospitalName" class="input" maxlength="150" data-case="title">
            </div>
            <div class="f">
                <label for="drName">Dr Name</label>
                <input type="text" id="drName" name="drName" class="input" maxlength="100" data-case="title">
            </div>
            <div class="f">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" class="input" maxlength="255" data-case="title">
            </div>

            <div class="f">
                <label for="diagnosticCenter">Diagnostic center</label>
                <input type="text" id="diagnosticCenter" name="diagnosticCenter" class="input" maxlength="150" data-case="title">
            </div>
            <div class="f">
                <label for="details">Details</label>
                <input type="text" id="details" name="details" class="input" maxlength="1000">
            </div>
            <div class="f">
                <label for="diagAddress">Diag Address</label>
                <input type="text" id="diagAddress" name="diagAddress" class="input" maxlength="255" data-case="title">
            </div>
        </div>

        <section class="attachments" aria-label="Documents">
            <div class="att">
                <span class="lbl">Prescription</span>
                <label class="file">
                    <input type="file" multiple name="prescription" aria-label="Prescription attachment" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
                    <span class="file-text">attachment</span>
                </label>
            </div>
            <div class="att">
                <span class="lbl">Bill</span>
                <label class="file">
                    <input type="file" multiple name="bill" aria-label="Bill attachment" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
                    <span class="file-text">attachment</span>
                </label>
            </div>
            <div class="att">
                <span class="lbl">Scan Documents</span>
                <label class="file">
                    <input type="file" multiple name="scanDocuments" aria-label="Scan documents attachment" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
                    <span class="file-text">attachment</span>
                </label>
            </div>
            <div class="att">
                <span class="lbl">Others</span>
                <label class="file">
                    <input type="file" multiple name="others" aria-label="Other documents attachment" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
                    <span class="file-text">attachment</span>
                </label>
            </div>
        </section>

        <div class="actions">
            <button type="submit" id="submitBtn" class="btn">Submit</button>
            <p id="formMsg" class="msg" role="alert"></p>
        </div>
    </form>
    </div>
</main>

<!-- Confirmation popup -->
<div id="confirmModal" class="modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">Confirm submit</h2>
        <p id="confirmText"></p>
        <div class="modal-actions">
            <button type="button" id="confirmNo" class="btn secondary">Cancel</button>
            <button type="button" id="confirmYes" class="btn">Yes, save</button>
        </div>
    </div>
</div>

<script src="js/nav.js"></script>
<script src="js/format.js"></script>
<script src="js/record.js"></script>
</body>
</html>
