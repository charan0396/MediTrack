<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="login-wrap">
        <form id="loginForm" class="login-form" autocomplete="off" novalidate>
            <h1 class="brand">MediTrack</h1>
            <input type="text" id="user" class="field" placeholder="User" aria-label="User">
            <input type="password" id="password" class="field" placeholder="Password" aria-label="Password">
            <div class="btn-row">
                <button type="submit" class="btn">Login</button>
                <button type="button" id="newUserBtn" class="btn">New User</button>
            </div>
            <a href="#" id="forgotLink" class="forgot">Forgot password?</a>
            <p id="loginMsg" class="msg" role="alert"></p>
        </form>
    </main>

    <!-- New User popup -->
    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button type="button" id="closeModal" class="close" aria-label="Close">&times;</button>
            <h2 id="modalTitle">New User</h2>
            <form id="registerForm" autocomplete="off" novalidate>
                <input type="text" id="newName" class="field" placeholder="Name" aria-label="Name">
                <input type="password" id="newPassword" class="field" placeholder="Password" aria-label="Password">
                <button type="submit" class="btn">Submit</button>
                <p id="registerMsg" class="msg" role="alert"></p>
            </form>
        </div>
    </div>

    <!-- Forgot password popup -->
    <div id="resetModal" class="modal" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
            <button type="button" id="closeReset" class="close" aria-label="Close">&times;</button>
            <h2 id="resetTitle">Reset Password</h2>
            <form id="resetForm" autocomplete="off" novalidate>
                <input type="text" id="resetUser" class="field" placeholder="User" aria-label="User">
                <input type="password" id="resetNew" class="field" placeholder="New password" aria-label="New password">
                <input type="password" id="resetConfirm" class="field" placeholder="Confirm password" aria-label="Confirm password">
                <input type="password" id="resetCode" class="field" placeholder="Reset code" aria-label="Reset code">
                <button type="submit" class="btn">Reset</button>
                <p id="resetMsg" class="msg" role="alert"></p>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
